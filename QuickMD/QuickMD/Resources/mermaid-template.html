<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; }
  #output { display: flex; justify-content: center; }
  #output svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<div id="output"></div>
<script src="mermaid.min.js"></script>
<script>
  var resizeDiagram = null;
  // mmdc answers asynchronously: a render that finishes after a newer one
  // started (theme switch, zoom) must not overwrite it.
  var renderGeneration = 0;
  window.addEventListener('resize', function() {
    if (resizeDiagram) resizeDiagram();
  });

  // useCLI: the SVG comes from the reader's mmdc through the Swift `mmdc`
  // reply handler (MermaidCLI.swift); if that fails, the bundled mermaid.js
  // draws it instead. Everything after the SVG is the same for both.
  function renderDiagram(source, isDark, scale = 1, fitWindow = false, useCLI = false) {
    // renderDiagram may run repeatedly on this page (theme switches re-render
    // in place). mermaid.render can leave its temp element behind after a
    // failed render — remove it or the next render throws on a duplicate id.
    var stale = document.getElementById('ddiagram');
    if (stale) stale.remove();

    mermaid.initialize({
      startOnLoad: false,
      theme: isDark ? 'dark' : 'default',
      securityLevel: 'strict',
      fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif'
    });

    const container = document.getElementById('output');
    const generation = ++renderGeneration;
    resizeDiagram = null;
    container.innerHTML = '';

    // Report height back to Swift. The zoom viewer hosts this same template
    // WITHOUT a mermaidHeight handler -- the report must never break rendering
    // (an unguarded postMessage throws, and the catch() below would replace a
    // perfectly good SVG with the error text).
    function reportHeight() {
      try {
        window.webkit.messageHandlers.mermaidHeight.postMessage(
          container.getBoundingClientRect().height
        );
      } catch (e) { /* no handler in this host -- fine */ }
    }

    function builtInSVG() {
      return mermaid.render('diagram', source).then(function(result) { return result.svg; });
    }
    var svgText = builtInSVG;
    if (useCLI && window.webkit && window.webkit.messageHandlers.mmdc) {
      svgText = function() {
        return window.webkit.messageHandlers.mmdc
          .postMessage({ source: source, isDark: isDark })
          .catch(function(err) {
            console.log('mmdc failed, using mermaid.js: ' + err);
            return builtInSVG();
          });
      };
    }

    svgText().then(function(svgMarkup) {
      if (generation !== renderGeneration) return;
      container.innerHTML = svgMarkup;
      const svg = container.querySelector('svg');
      const bounds = svg.viewBox.baseVal;
      const naturalWidth = bounds.width;
      const naturalHeight = bounds.height;
      if (fitWindow) {
        document.body.style.display = 'flex';
        document.body.style.alignItems = 'center';
        document.body.style.minHeight = '100vh';
        container.style.width = '100%';
      }
      resizeDiagram = function() {
        if (naturalWidth > 0 && naturalHeight > 0) {
          const factor = fitWindow
            ? Math.min(window.innerWidth / naturalWidth, window.innerHeight / naturalHeight)
            : Math.min(scale * Math.min(1, window.innerWidth / naturalWidth),
                       window.innerWidth / naturalWidth);
          svg.style.maxWidth = 'none';
          svg.style.width = (naturalWidth * factor) + 'px';
          svg.style.height = (naturalHeight * factor) + 'px';
        }
        reportHeight();
      };
      resizeDiagram();
    }).catch(function(err) {
      if (generation !== renderGeneration) return;
      container.innerHTML = '<pre style="color:#e55;font-size:12px;padding:8px;">' +
        err.message.replace(/</g, '&lt;') + '</pre>';
      reportHeight();
    });
  }
</script>
</body>
</html>
